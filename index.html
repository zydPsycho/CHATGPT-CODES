<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>BLACKMARK — AI Command Vault</title>
<style>
:root{--black:#000;--white:#fff;--soft:#f4f4f4;--line:#dedede;--muted:#666}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--white);color:var(--black);font-family:Arial,Helvetica,sans-serif}
body{min-height:100vh}
button,input{font:inherit}
button{cursor:pointer}
button:active{transform:scale(.98)}
.header{position:sticky;top:0;z-index:50;background:#fff;border-bottom:2px solid #000}
.header-inner{min-height:104px;padding:14px 16px;display:flex;align-items:center;justify-content:center}
.brand{text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px}
.brand-mark{width:42px;height:42px;background:#000;color:#fff;border-radius:14px;display:grid;place-items:center;font-size:15px;font-weight:900;letter-spacing:-1px}
.brand h1{margin:0;font-size:24px;line-height:1;font-weight:900;letter-spacing:2px}
.brand p{margin:0;font-size:10px;font-weight:800;letter-spacing:2.4px;color:#555}
.app{max-width:1120px;margin:auto;padding:18px 14px 42px}
.hero{padding:8px 0 18px;text-align:center}
.hero h2{margin:0 0 8px;font-size:30px;font-weight:900}
.hero p{margin:0 auto;max-width:650px;font-size:14px;line-height:1.55;color:#555}
.search{margin:10px 0 18px}
.search input{width:100%;padding:15px 16px;border:2px solid #000;border-radius:15px;outline:none;background:#fff;color:#000;font-size:15px}
.search input:focus{box-shadow:0 0 0 3px #eee}
.section-label{margin:20px 0 10px;font-size:12px;font-weight:900;letter-spacing:1.4px;text-transform:uppercase}
.scroll-row{display:flex;gap:8px;overflow:auto;padding:2px 0 10px;scrollbar-width:none}
.scroll-row::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:2px solid #000;background:#fff;color:#000;border-radius:13px;padding:10px 13px;font-size:12px;font-weight:800}
.chip.active{background:#000;color:#fff}
.sub-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.sub{border:2px solid #000;background:#f5f5f5;color:#000;border-radius:11px;padding:9px 12px;font-size:12px;font-weight:800}
.sub.active{background:#000;color:#fff}
.content-head{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;border-bottom:2px solid #000;padding-bottom:10px;margin:8px 0 12px}
.content-head h3{margin:0;font-size:21px}
.count{font-size:12px;font-weight:800;color:#666;text-align:right}
.mode-row{display:flex;gap:7px;margin:14px 0}
.mode{flex:1;border:2px solid #000;border-radius:12px;background:#fff;padding:10px 8px;font-size:12px;font-weight:900}
.mode.active{background:#000;color:#fff}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.card{border:2px solid #000;border-radius:17px;padding:14px;display:flex;flex-direction:column;min-height:170px;background:#fff}
.card-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:15px;font-weight:900;word-break:break-word}
.badge{font-size:9px;border:1px solid #000;border-radius:7px;padding:4px 6px;font-weight:900;white-space:nowrap}
.desc{margin:13px 0;font-size:13px;line-height:1.5;color:#444;white-space:pre-wrap;flex:1}
.copy{width:100%;background:#000;color:#fff;border:2px solid #000;border-radius:11px;padding:11px;font-size:12px;font-weight:900}
.empty{border:2px dashed #000;border-radius:16px;padding:35px;text-align:center;font-weight:700;color:#555}
.footer{border-top:2px solid #000;text-align:center;padding:24px 14px;margin-top:34px}
.footer strong{display:block;font-size:16px;letter-spacing:1px}
.footer span{display:block;margin-top:5px;font-size:11px;font-weight:700;color:#666;letter-spacing:1px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(80px);background:#000;color:#fff;padding:12px 18px;border-radius:12px;font-size:13px;font-weight:800;transition:.22s;z-index:99}
.toast.show{transform:translateX(-50%) translateY(0)}
@media(max-width:800px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:560px){.header-inner{min-height:96px}.brand h1{font-size:22px}.hero h2{font-size:27px}.grid{grid-template-columns:1fr}.content-head{align-items:center}.mode{font-size:11px}.card{min-height:150px}}
</style>
</head>
<body>

<header class="header">
  <div class="header-inner">
    <div class="brand">
      <div class="brand-mark">BM</div>
      <h1>BLACKMARK</h1>
      <p>AI COMMAND VAULT</p>
    </div>
  </div>
</header>

<main class="app">
  <section class="hero">
    <h2>Command Library</h2>
    <p>Organized slash-style commands, ready-to-use editing prompts, and scene enhancement recipes.</p>
  </section>

  <div class="search"><input id="search" placeholder="Search commands, categories or prompts..."></div>

  <div class="section-label">Categories</div>
  <div id="categories" class="scroll-row"></div>

  <div class="section-label">Subcategories</div>
  <div id="subcategories" class="sub-row"></div>

  <div class="content-head">
    <h3 id="title">Quality Enhancement</h3>
    <div id="count" class="count"></div>
  </div>

  <div class="mode-row">
    <button class="mode active" data-mode="commands">Commands</button>
    <button class="mode" data-mode="ready">Ready Prompts</button>
    <button class="mode" data-mode="scene">Scene Prompts</button>
  </div>

  <div id="grid" class="grid"></div>
</main>

<footer class="footer">
  <strong>BLACKMARK</strong>
  <span>AI COMMAND VAULT</span>
</footer>

<div id="toast" class="toast">Copied</div>

<script>
const DB = [
["Quality & Restoration",[
["Quality Enhancement",[
["/hdreal","High-definition realistic enhancement"],["/4k","4K-style detail and clarity enhancement"],["/8k","Ultra-high-resolution enhancement"],["/enhance","General image enhancement"],["/quality","Improve overall image quality"],["/natural","Keep enhancement natural and believable"]]],
["Sharpness & Detail",[
["/sharpen","Increase perceived sharpness"],["/details","Recover or enhance fine details"],["/clarity","Improve local contrast and clarity"],["/deblur","Reduce blur and recover edges"],["/denoise","Reduce digital noise and artifacts"]]],
["Repair & Reconstruction",[
["/restore","Restore an old or degraded image"],["/repair","Repair visible image defects"],["/reconstruct","Reconstruct missing or damaged visual information"],["/upscale","Increase resolution while preserving detail"],["/clean","Remove visual dirt, marks and distractions"]]]
]],
["Face & Identity",[
["Face Correction",[
["/facefix","Correct facial rendering while preserving identity"],["/faceenhance","Enhance facial detail and definition"],["/faceclear","Make facial features clearer"],["/faceidentity","Prioritize identity consistency"],["/faceswap","Replace a face when an appropriate reference is provided"]]],
["Skin & Facial Detail",[
["/skin","Improve skin appearance"],["/skinfix","Correct distracting skin artifacts"],["/naturalface","Keep facial enhancement realistic"],["/eyes","Improve eye clarity while preserving the person"],["/teeth","Clean up teeth appearance naturally"]]],
["Consistency",[
["/identitylock","Keep the same core facial identity across changes"],["/faceconsistent","Maintain facial structure between generations"],["/referenceface","Use the supplied reference as the identity anchor"]]]
]],
["Lighting & Color",[
["Lighting",[
["/relight","Re-light the subject or scene"],["/goldenhour","Golden-hour lighting"],["/daylight","Natural daytime lighting"],["/softlight","Soft flattering illumination"],["/dramaticlight","Cinematic dramatic lighting"],["/studio","Controlled professional studio lighting"],["/rimlight","Add controlled rim or back lighting"]]],
["Color",[
["/colorize","Add realistic color to a monochrome image"],["/naturalcolor","Natural believable color treatment"],["/vivid","Increase color impact without destroying realism"],["/cinematiccolor","Cinematic color grading"],["/warm","Warmer overall color treatment"],["/cool","Cooler overall color treatment"],["/bw","Black-and-white treatment"]]]
]],
["Camera, Motion & Stability",[
["Camera & Perspective",[
["/droneview","High aerial or drone-style perspective"],["/wideangle","Wider field of view"],["/closeup","Close framing"],["/portrait","Portrait-oriented composition"],["/lowangle","Low camera angle"],["/highangle","High camera angle"],["/overhead","Top-down camera view"],["/pov","Point-of-view perspective"]]],
["Motion & Stability",[
["/antishake","Reduce camera-shake appearance"],["/walking","Create or restore a natural walking-motion context"],["/motion","Add controlled motion characteristics"],["/freeze","Emphasize a crisp frozen moment"]]],
["Reframing",[
["/reframe","Recompose for better subject placement"],["/crop","Crop around important content"],["/center","Center the main subject"],["/expand","Extend composition beyond the original frame"],["/vertical","Optimize for vertical framing"],["/horizontal","Optimize for horizontal framing"]]]
]],
["Background & Object Cleanup",[
["Background",[
["/backgroundclean","Clean and simplify the background"],["/blurbackground","Add controlled background blur"],["/replacebackground","Replace the background while preserving the subject"],["/removebackground","Remove the background"],["/extendbackground","Extend the existing environment naturally"]]],
["People & Objects",[
["/removepeople","Remove unwanted people"],["/removeobject","Remove an unwanted object"],["/cleanup","Clean distracting elements"],["/declutter","Reduce visual clutter"],["/erase","Remove a specified element"]]]
]],
["Composition & Design",[
["Composition",[
["/professional","Professional-looking composition and finish"],["/balanced","Improve visual balance"],["/symmetry","Strengthen symmetry where appropriate"],["/minimal","Minimal uncluttered composition"],["/cinematic","Cinematic composition"],["/dynamic","More energetic composition"]]],
["Aspect Ratios & Formats",[
["/9:16","Vertical phone or social format"],["/16:9","Widescreen format"],["/1:1","Square format"],["/4:5","Portrait social-media format"],["/3:4","Standard portrait format"]]]
]],
["Style & Visual Transformation",[
["Photographic Styles",[
["/photoreal","Photorealistic rendering"],["/hyperreal","Highly detailed realistic rendering"],["/editorial","Editorial photography look"],["/fashion","Fashion or editorial visual treatment"],["/product","Clean product-photography treatment"],["/documentary","Documentary-style realism"]]],
["Artistic Styles",[
["/illustration","Illustration-style rendering"],["/anime","Anime-inspired transformation"],["/comic","Comic-book visual treatment"],["/watercolor","Watercolor painting style"],["/oilpaint","Oil-painting style"],["/sketch","Sketch-style rendering"],["/3d","3D-rendered appearance"]]]
]],
["Video & Animation",[
["Motion Planning",[
["/animate","Animate specified elements"],["/animateparts","Animate individual parts independently"],["/smoothmotion","Use smooth controlled motion"],["/loop","Design motion to loop cleanly"],["/slowmotion","Slow graceful motion"]]],
["Camera Motion",[
["/pan","Horizontal camera movement"],["/tilt","Vertical camera movement"],["/zoom","Controlled zoom"],["/dolly","Forward or backward camera movement"],["/orbit","Camera orbit around the subject"],["/drone","Aerial camera movement"]]],
["Video Quality",[
["/videoreal","Realistic video appearance"],["/motionblur","Natural motion blur"],["/stabilized","Stabilized-camera appearance"],["/frameclean","Clean visual frame quality"]]]
]],
["Logo, Branding & Graphics",[
["Logo Treatment",[
["/logoclean","Clean up a logo"],["/logorecreate","Recreate a logo faithfully"],["/logooutline","Add a controlled outline"],["/monochrome","Restrict logo to monochrome treatment"],["/brandmark","Emphasize the primary brand mark"]]],
["Graphic Constraints",[
["/blackredblue","Restrict design to black, red and blue"],["/whiteaccent","Permit controlled white accent lines"],["/transparent","Transparent-background graphic"],["/vectorlook","Clean vector-like appearance"],["/icon","Optimize for icon or app-logo use"]]]
]],
["Text, Posters & UI Visuals",[
["Typography & Layout",[
["/textclear","Make text visually clearer"],["/typography","Improve typography and hierarchy"],["/poster","Poster-style composition"],["/banner","Banner composition"],["/splash","App splash-screen composition"],["/ui","UI-oriented visual composition"]]],
["App & Screen Formats",[
["/androidportrait","Android portrait screen composition"],["/mobile","Mobile-first framing"],["/desktop","Desktop or widescreen framing"],["/splashscreen","App splash-screen layout"]]]
]],
["Architecture, Floorplans & Space",[
["Floorplan",[
["/floorplan","Create or refine a floorplan"],["/layout","Improve room or layout arrangement"],["/dimension","Add or clarify dimensions"],["/roomlabel","Add clear room labels"],["/circulation","Improve movement and circulation"]]],
["Architectural Visualization",[
["/exterior","Exterior architectural visualization"],["/interior","Interior visualization"],["/aerialplan","Aerial or site-plan perspective"],["/3dplan","3D floorplan presentation"]]]
]],
["Environment & Atmosphere",[
["Weather & Time",[
["/sunset","Sunset atmosphere"],["/sunrise","Sunrise atmosphere"],["/night","Nighttime treatment"],["/rain","Rainy atmosphere"],["/fog","Fog or mist atmosphere"],["/overcast","Overcast lighting"]]],
["Atmosphere",[
["/moody","Moody atmospheric treatment"],["/bright","Bright airy treatment"],["/dark","Darker dramatic treatment"],["/cleanlook","Clean commercial finish"],["/naturalambient","Natural ambient environment"]]]
]],
["Subject Preservation & Editing Rules",[
["Preservation",[
["/preserveface","Preserve facial identity"],["/preservepose","Preserve the original pose"],["/preserveclothes","Preserve clothing unless explicitly changed"],["/preservebackground","Preserve the original background"],["/preservedetails","Preserve important original details"]]],
["Selective Editing",[
["/onlyface","Restrict changes primarily to the face"],["/onlybackground","Restrict changes to the background"],["/onlylighting","Change lighting without redesigning the scene"],["/onlycolor","Change color treatment only"],["/subtle","Make changes subtle and restrained"]]]
]],
["Command Combinations",[
["Recommended Structure",[
["/antishake /walking /facefix /relight /4k","Walking restoration recipe"],["/droneview /goldenhour /hdreal /natural","Aerial golden-hour realism recipe"],["/professional /reframe /4k /clean","Professional cleanup and reframing recipe"]]],
["Priority Rules",[
["/preserveface + style","Identity preservation takes priority over style changes"],["specific background/object instruction","Specific instructions take priority over generic cleanup"],["aspect ratio + /reframe","Apply format instructions during composition and reframing"]]]
]]
];

let cat=0, sub=0, mode="commands";

const $=id=>document.getElementById(id);
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function current(){return DB[cat][1][sub]}
function allSearch(q){
 const out=[];
 DB.forEach((C,ci)=>C[1].forEach((S,si)=>S[1].forEach(x=>{
   if((C[0]+" "+S[0]+" "+x[0]+" "+x[1]).toLowerCase().includes(q)) out.push({c:ci,s:si,item:x,cat:C[0],sub:S[0]});
 })));
 return out;
}
function renderCategories(){
 $("categories").innerHTML=DB.map((x,i)=>`<button class="chip ${i===cat?"active":""}" onclick="pickCat(${i})">${esc(x[0])}</button>`).join("");
}
function renderSubs(){
 $("subcategories").innerHTML=DB[cat][1].map((x,i)=>`<button class="sub ${i===sub?"active":""}" onclick="pickSub(${i})">${esc(x[0])}</button>`).join("");
}
function pickCat(i){cat=i;sub=0;mode="commands";$("search").value="";render()}
function pickSub(i){sub=i;$("search").value="";renderContent();renderSubs()}
function recipeList(type){
 const [name,items]=current();
 const extras=type==="ready"
 ? ["Preserve the important original details and keep the result natural.","Improve the result while avoiding unnecessary changes.","Apply the edit cleanly with realistic proportions and believable textures.","Keep the main subject consistent and professionally finished.","Use precise editing and retain visual coherence."]
 : ["Enhance the surrounding scene with realistic depth and atmosphere.","Create a believable cinematic environment without changing the main subject unnecessarily.","Improve environmental detail, lighting and spatial realism.","Build a visually coherent scene with natural perspective and depth.","Strengthen mood and atmosphere while keeping the composition clean."];
 const scenes=["cinematic environment","natural outdoor scene","professional studio setting","urban night scene","golden-hour landscape"];
 const out=[];
 for(let i=0;i<25;i++){
   const a=items[i%items.length], b=items[(i+1)%items.length];
   const cmd=type==="ready"?`${a[0]} ${b[0]}`:`${a[0]} ${b[0]} /cinematic`;
   out.push([cmd, `${cmd}\n\n${type==="ready"?"Apply this edit to the uploaded image. ":"Enhance the image into a "+scenes[i%scenes.length]+". "}${a[1]}. ${extras[i%extras.length]}`]);
 }
 return out;
}
function card(code,desc,badge="COMMAND"){
 return `<article class="card"><div class="card-top"><div class="code">${esc(code)}</div><span class="badge">${badge}</span></div><div class="desc">${esc(desc)}</div><button class="copy" onclick='copyText(${JSON.stringify(code+"\n\n"+desc)})'>COPY</button></article>`;
}
function renderContent(){
 const q=$("search").value.trim().toLowerCase();
 if(q){
   const results=allSearch(q);
   $("title").textContent="Search Results"; $("count").textContent=`${results.length} command${results.length===1?"":"s"} found`;
   $("grid").innerHTML=results.length?results.map(r=>card(r.item[0],`${r.cat} → ${r.sub}\n\n${r.item[1]}`,"RESULT")).join(""):`<div class="empty">No matching commands found.</div>`;
   return;
 }
 const [name,items]=current();
 let list=items,badge="COMMAND";
 if(mode==="ready"){list=recipeList("ready");badge="READY PROMPT"}
 if(mode==="scene"){list=recipeList("scene");badge="SCENE PROMPT"}
 $("title").textContent=name;
 $("count").textContent=`${list.length} ${mode==="commands"?"commands":mode==="ready"?"ready prompts":"scene prompts"}`;
 $("grid").innerHTML=list.map(x=>card(x[0],x[1],badge)).join("");
 document.querySelectorAll(".mode").forEach(b=>b.classList.toggle("active",b.dataset.mode===mode));
}
function render(){renderCategories();renderSubs();renderContent()}
function copyText(t){
 if(navigator.clipboard) navigator.clipboard.writeText(t); else {const x=document.createElement("textarea");x.value=t;document.body.appendChild(x);x.select();document.execCommand("copy");x.remove()}
 $("toast").classList.add("show");setTimeout(()=>$("toast").classList.remove("show"),1600);
}
document.querySelectorAll(".mode").forEach(b=>b.onclick=()=>{mode=b.dataset.mode;$("search").value="";renderContent()});
$("search").addEventListener("input",renderContent);
render();
</script>
</body>
</html>
